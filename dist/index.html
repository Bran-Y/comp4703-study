<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A public COMP4703 revision workspace: bilingual exam sections, English exam-style answers, Chinese study notes, worked calculations and self-testing.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#285746">
  <title>COMP4703 · Study Studio</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="study-data.js"></script>
  <script defer src="final-review-data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <noscript><p>This study workspace needs JavaScript enabled to show the question bank and save your learning progress.</p></noscript>
  <a class="skip" href="#main">跳到学习内容</a>
  <aside id="sidebar" class="sidebar" aria-label="学习导航"></aside>
  <div id="scrim" class="scrim" hidden></div>
  <div class="workspace">
    <header class="topbar">
      <button class="icon-button mobile-menu" data-action="menu" aria-label="展开导航">☰</button>
      <div class="breadcrumb">COMP4703 <span>/</span> <span id="breadcrumb">学习概览</span></div>
      <div class="top-actions"><button id="zh-toggle" class="text-button" data-action="zh" aria-pressed="true" title="Show or hide complete Chinese translations">中英对照 <span class="switch-dot"></span></button><span class="private-tag">公开学习空间</span></div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer"><span>Built around the lectures, not exam predictions.</span><span>学习记录保存在本浏览器 · 可在「资料与勘误」导出备份</span></footer>
  </div>
  <div id="toast" role="status" class="toast" hidden></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
</body>
</html>
